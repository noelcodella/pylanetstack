# PyLanetStack example: Moon and other large bright surfaces.
#
# This recipe favors crispness over heavy noise reduction: it keeps fewer
# frames, uses denser alignment points, and avoids aggressive planet-style
# postprocessing that can make lunar surfaces look thresholded.
#
# Use with:
#   pylanetstack run INPUT_DIR OUTPUT_DIR --config examples/pylanetstack.moon.yaml

performance:
  workers: 4

crop:
  crop_size: auto
  auto_crop_margin: 1.35
  auto_crop_min_size: 250
  auto_crop_max_size: null
  auto_crop_sample_frames: 12
  output_mode: linear-rgb
  white_balance: camera
  recursive: false
  save_raw_crop: false
  compression: null
  overwrite: false
  skip_bad_raw: true
  max_frames: null
  video_frame_step: 1

filtering:
  keep_best_percent: 3
  keep_best_frames: null
  quality_weighting: true
  quality_weight_scale: 0.5
  quality_weight_min: 0.25
  quality_weight_max: 4.0
  reference: best

alignment:
  method: ap
  upsample_factor: 20
  update_reference_every: 0
  registration_max_shift: 50
  ap:
    patch_size: 48
    spacing: 24
    blend_sigma: 28
    max_points: 20000
    min_mask_fraction: 0.25
    min_contrast: 0.015
  flow:
    warps: 5
    iterations: 10
    attachment: 15.0
    tightness: 0.3
    smoothing_sigma: 0.3
    max_pixels: 0.8

channel_alignment:
  enabled: true
  reference: green
  max_shift: 3
  upsample_factor: 20

postprocessing:
  enabled: true
  input_max: 65535
  level_black: auto
  level_white: auto
  level_gamma: 0.9
  exposure: 0
  highlight_compression: 0.05
  texture: 25
  texture_radius: 2
  dehaze: 10
  dehaze_radius: 12
  sharpening: 250
  sharpening_radius: 0.45
  wb_mode: auto
  wb_strength: 0.2
  red_balance: 1
  green_balance: 1
  blue_balance: 1
  saturation: 1
  vibrance: 0
  background_black: false
  background_dilate: 3
  background_feather: 4
  upsample: 1
  upsample_smoothing: 0.35

output:
  dtype: uint16
  stack_upsample: 1
  preview: true
  preview_low_percentile: 0.5
  preview_high_percentile: 99.95
  compression: null

run:
  overwrite: false
  max_frames: null
  crop_compression: null
  stack_compression: null

stack:
  recursive: false
  max_frames: null
  compression: null
