[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylanetstack"
version = "0.1.0"
description = "Planetary crop, registration, and nonlinear stacking tools for RAW, image, and video inputs."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "PyLanetStack contributors" }
]
keywords = ["astrophotography", "planetary", "stacking", "raw", "registration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "imageio>=2.31",
  "imageio-ffmpeg>=0.4",
  "numpy>=1.23",
  "rawpy>=0.19",
  "PyYAML>=6.0",
  "scipy>=1.9",
  "scikit-image>=0.20",
  "tifffile>=2023.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
pylanetstack = "pylanetstack.cli:main"
planetstack = "pylanetstack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
